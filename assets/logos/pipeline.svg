<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 280" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d2f"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>
    <filter id="pShadow" x="-5%" y="-5%" width="110%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="flowArrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="flowArrowActive" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="510" y="32" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">End-to-End Processing Pipeline</text>
  <text x="510" y="52" text-anchor="middle" fill="#94a3b8" font-size="12">How sound transforms into structured, domain-tailored study notes with rendered math</text>

  <!-- Step 1: Capture -->
  <g transform="translate(25, 75)" filter="url(#pShadow)">
    <rect width="165" height="170" rx="10" fill="url(#pGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="165" height="3" rx="1.5" fill="#38bdf8"/>
    <circle cx="82" cy="35" r="16" fill="#0369a1"/>
    <text x="82" y="41" text-anchor="middle" fill="#ffffff" font-size="14">🎙️</text>
    <text x="82" y="70" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">1. Audio Capture</text>
    <text x="82" y="92" text-anchor="middle" fill="#94a3b8" font-size="11">WASAPI Loopback</text>
    <text x="82" y="108" text-anchor="middle" fill="#64748b" font-size="10">System sound only</text>
    <rect x="18" y="125" width="129" height="30" rx="6" fill="#0c4a6e"/>
    <text x="82" y="144" text-anchor="middle" fill="#bae6fd" font-size="10" font-weight="600">30-min .flac chunks</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="190" y1="160" x2="223" y2="160" stroke="#38bdf8" stroke-width="2" marker-end="url(#flowArrowActive)"/>

  <!-- Step 2: Compress -->
  <g transform="translate(225, 75)" filter="url(#pShadow)">
    <rect width="165" height="170" rx="10" fill="url(#pGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="165" height="3" rx="1.5" fill="#06b6d4"/>
    <circle cx="82" cy="35" r="16" fill="#0e7490"/>
    <text x="82" y="41" text-anchor="middle" fill="#ffffff" font-size="14">🗜️</text>
    <text x="82" y="70" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">2. Compression</text>
    <text x="82" y="92" text-anchor="middle" fill="#94a3b8" font-size="11">Background FFmpeg</text>
    <text x="82" y="108" text-anchor="middle" fill="#64748b" font-size="10">~85% size reduction</text>
    <rect x="18" y="125" width="129" height="30" rx="6" fill="#164e63"/>
    <text x="82" y="144" text-anchor="middle" fill="#a5f3fc" font-size="10" font-weight="600">Opus 24kbps (.opus)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="390" y1="160" x2="423" y2="160" stroke="#06b6d4" stroke-width="2" marker-end="url(#flowArrowActive)"/>

  <!-- Step 3: Transcribe -->
  <g transform="translate(425, 75)" filter="url(#pShadow)">
    <rect width="165" height="170" rx="10" fill="url(#pGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="165" height="3" rx="1.5" fill="#10b981"/>
    <circle cx="82" cy="35" r="16" fill="#047857"/>
    <text x="82" y="41" text-anchor="middle" fill="#ffffff" font-size="14">📝</text>
    <text x="82" y="70" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">3. Speech-to-Text</text>
    <text x="82" y="92" text-anchor="middle" fill="#94a3b8" font-size="11">Groq Whisper (fast)</text>
    <text x="82" y="108" text-anchor="middle" fill="#64748b" font-size="10">Fallback: Gemini File API</text>
    <rect x="18" y="125" width="129" height="30" rx="6" fill="#064e3b"/>
    <text x="82" y="144" text-anchor="middle" fill="#a7f3d0" font-size="10" font-weight="600">Transcript/{name}.txt</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="590" y1="160" x2="623" y2="160" stroke="#10b981" stroke-width="2" marker-end="url(#flowArrowActive)"/>

  <!-- Step 4: AI Summarization -->
  <g transform="translate(625, 75)" filter="url(#pShadow)">
    <rect width="170" height="170" rx="10" fill="url(#pGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="170" height="3" rx="1.5" fill="#f59e0b"/>
    <circle cx="85" cy="35" r="16" fill="#b45309"/>
    <text x="85" y="41" text-anchor="middle" fill="#ffffff" font-size="14">🧠</text>
    <text x="85" y="70" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">4. Domain Summary</text>
    <text x="85" y="92" text-anchor="middle" fill="#94a3b8" font-size="11">8 Academic Profiles</text>
    <text x="85" y="108" text-anchor="middle" fill="#64748b" font-size="10">Hierarchical 4-merge</text>
    <rect x="18" y="125" width="134" height="30" rx="6" fill="#78350f"/>
    <text x="85" y="144" text-anchor="middle" fill="#fde68a" font-size="10" font-weight="600">Markdown/{name}.md</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <line x1="795" y1="160" x2="828" y2="160" stroke="#f59e0b" stroke-width="2" marker-end="url(#flowArrowActive)"/>

  <!-- Step 5: Render & PDF -->
  <g transform="translate(830, 75)" filter="url(#pShadow)">
    <rect width="165" height="170" rx="10" fill="url(#pGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="165" height="3" rx="1.5" fill="#a855f7"/>
    <circle cx="82" cy="35" r="16" fill="#7e22ce"/>
    <text x="82" y="41" text-anchor="middle" fill="#ffffff" font-size="14">📄</text>
    <text x="82" y="70" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="700">5. View &amp; PDF</text>
    <text x="82" y="92" text-anchor="middle" fill="#94a3b8" font-size="11">In-app LaTeX math</text>
    <text x="82" y="108" text-anchor="middle" fill="#64748b" font-size="10">RTL Arabic + Pygments</text>
    <rect x="18" y="125" width="129" height="30" rx="6" fill="#581c87"/>
    <text x="82" y="144" text-anchor="middle" fill="#e9d5ff" font-size="10" font-weight="600">One-Click PDF Export</text>
  </g>
</svg>
