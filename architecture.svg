<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 640" width="100%" height="100%" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151d2f"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <text x="510" y="42" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700" letter-spacing="0.5">StudyNotes — System Architecture</text>
  <text x="510" y="66" text-anchor="middle" fill="#94a3b8" font-size="13">Modular pipeline connecting system audio capture, atomic state, and multi-provider AI processing</text>

  <!-- 1. AUDIO PIPELINE -->
  <g transform="translate(30, 95)" filter="url(#shadow)">
    <rect width="215" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="215" height="4" rx="2" fill="url(#blueGlow)"/>
    <text x="20" y="32" fill="#38bdf8" font-size="14" font-weight="700">1. Audio Capture</text>
    <text x="20" y="48" fill="#64748b" font-size="11">WASAPI &amp; Compression</text>

    <!-- Sub-boxes -->
    <rect x="15" y="65" width="185" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="88" fill="#f1f5f9" font-size="12" font-weight="600">WASAPI Loopback</text>
    <text x="25" y="106" fill="#94a3b8" font-size="11">Internal system sound</text>
    <text x="25" y="120" fill="#94a3b8" font-size="11">No microphone needed</text>

    <rect x="15" y="142" width="185" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="165" fill="#f1f5f9" font-size="12" font-weight="600">30-Min Auto-Chunk</text>
    <text x="25" y="183" fill="#94a3b8" font-size="11">Continuous safe recording</text>

    <rect x="15" y="210" width="185" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="233" fill="#f1f5f9" font-size="12" font-weight="600">Opus Compression</text>
    <text x="25" y="251" fill="#94a3b8" font-size="11">Background FFmpeg (24k)</text>

    <rect x="15" y="282" width="185" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="303" fill="#38bdf8" font-size="11" font-weight="600">Sound_Recorded/</text>
    <text x="25" y="316" fill="#64748b" font-size="10">FLAC / Opus audio files</text>
  </g>

  <!-- 2. STATE & STORAGE -->
  <g transform="translate(275, 95)" filter="url(#shadow)">
    <rect width="215" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="215" height="4" rx="2" fill="url(#amberGlow)"/>
    <text x="20" y="32" fill="#fbbf24" font-size="14" font-weight="700">2. State &amp; Storage</text>
    <text x="20" y="48" fill="#64748b" font-size="11">state_manager.py</text>

    <rect x="15" y="65" width="185" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="88" fill="#f1f5f9" font-size="12" font-weight="600">Atomic State Engine</text>
    <text x="25" y="106" fill="#94a3b8" font-size="11">.json.tmp + os.replace()</text>
    <text x="25" y="120" fill="#94a3b8" font-size="11">Crash &amp; power-loss safe</text>

    <rect x="15" y="142" width="185" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="165" fill="#f1f5f9" font-size="12" font-weight="600">Range Tracking</text>
    <text x="25" y="183" fill="#94a3b8" font-size="11">Character offset index</text>
    <text x="25" y="197" fill="#94a3b8" font-size="11">Safe selective deletion</text>

    <rect x="15" y="220" width="185" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="243" fill="#f1f5f9" font-size="12" font-weight="600">Multi-Level Undo</text>
    <text x="25" y="259" fill="#94a3b8" font-size="11">Roll back last notes update</text>

    <rect x="15" y="282" width="185" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="303" fill="#fbbf24" font-size="11" font-weight="600">Transcript/ &amp; Markdown/</text>
    <text x="25" y="316" fill="#64748b" font-size="10">Raw text &amp; study notes</text>
  </g>

  <!-- 3. AI PIPELINE -->
  <g transform="translate(520, 95)" filter="url(#shadow)">
    <rect width="230" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="230" height="4" rx="2" fill="url(#emeraldGlow)"/>
    <text x="20" y="32" fill="#34d399" font-size="14" font-weight="700">3. AI Engine &amp; Routing</text>
    <text x="20" y="48" fill="#64748b" font-size="11">process_lecture.py</text>

    <rect x="15" y="65" width="200" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="87" fill="#f1f5f9" font-size="12" font-weight="600">Multi-Provider STT</text>
    <text x="25" y="103" fill="#34d399" font-size="11">Groq Whisper</text>
    <text x="100" y="103" fill="#64748b" font-size="11">-></text>
    <text x="115" y="103" fill="#38bdf8" font-size="11">Gemini Audio</text>
    <text x="25" y="117" fill="#94a3b8" font-size="10">Auto-delete temporary files</text>

    <rect x="15" y="135" width="200" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="156" fill="#f1f5f9" font-size="12" font-weight="600">8 Subject Profiles</text>
    <text x="25" y="173" fill="#94a3b8" font-size="11">CS, Med, Law, Eng, Math...</text>
    <text x="25" y="188" fill="#94a3b8" font-size="11">+ 🔧 Corrections &amp; 🎯 Extras</text>

    <rect x="15" y="210" width="200" height="55" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="231" fill="#f1f5f9" font-size="12" font-weight="600">Hierarchical Merge</text>
    <text x="25" y="249" fill="#94a3b8" font-size="11">Batches of 4 chunks</text>

    <rect x="15" y="275" width="200" height="49" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="295" fill="#34d399" font-size="11" font-weight="600">Dynamic Failover &amp; Tuning</text>
    <text x="25" y="311" fill="#64748b" font-size="10">Remote model config via GitHub</text>
  </g>

  <!-- 4. PRESENTATION & EXPORT -->
  <g transform="translate(780, 95)" filter="url(#shadow)">
    <rect width="210" height="340" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <rect width="210" height="4" rx="2" fill="url(#purpleGlow)"/>
    <text x="20" y="32" fill="#c084fc" font-size="14" font-weight="700">4. GUI &amp; Export</text>
    <text x="20" y="48" fill="#64748b" font-size="11">gui_app.py / pdf_export.py</text>

    <rect x="15" y="65" width="180" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="88" fill="#f1f5f9" font-size="12" font-weight="600">Tkinter GUI</text>
    <text x="25" y="106" fill="#94a3b8" font-size="11">Thread-safe log queue</text>
    <text x="25" y="120" fill="#94a3b8" font-size="11">Bilingual Arabic/English</text>

    <rect x="15" y="142" width="180" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="165" fill="#f1f5f9" font-size="12" font-weight="600">LaTeX Rendering</text>
    <text x="25" y="183" fill="#94a3b8" font-size="11">Headless Matplotlib Agg</text>
    <text x="25" y="197" fill="#94a3b8" font-size="11">Inline $...$ to Base64 PNG</text>

    <rect x="15" y="220" width="180" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="25" y="243" fill="#f1f5f9" font-size="12" font-weight="600">Headless PDF Export</text>
    <text x="25" y="260" fill="#94a3b8" font-size="11">Edge/Chrome headless print</text>
    <text x="25" y="274" fill="#94a3b8" font-size="11">RTL Arabic + Syntax CSS</text>

    <rect x="15" y="295" width="180" height="29" rx="6" fill="#3b0764" stroke="#a855f7" stroke-width="0.8"/>
    <text x="25" y="314" fill="#e9d5ff" font-size="10" font-weight="600">StudyNotes_Setup.exe</text>
  </g>

  <!-- Connectors between Top Columns -->
  <line x1="245" y1="200" x2="273" y2="200" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-blue)"/>
  <line x1="490" y1="200" x2="518" y2="200" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="750" y1="200" x2="778" y2="200" stroke="#34d399" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>

  <!-- BOTTOM STRIP: CLOUD & EXTERNAL SERVICES -->
  <g transform="translate(30, 465)" filter="url(#shadow)">
    <rect width="960" height="140" rx="12" fill="url(#cardGrad)" stroke="#1e293b" stroke-width="1.5"/>
    <text x="25" y="28" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">EXTERNAL CLOUD &amp; LOCAL RUNTIMES</text>

    <!-- Cloud Badges -->
    <g transform="translate(25, 45)">
      <rect width="215" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="28" fill="#f87171" font-size="13" font-weight="700">Groq Cloud</text>
      <text x="18" y="47" fill="#cbd5e1" font-size="11">whisper-large-v3</text>
      <text x="18" y="62" fill="#64748b" font-size="10">High-speed primary transcription</text>
    </g>

    <g transform="translate(260, 45)">
      <rect width="215" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="28" fill="#60a5fa" font-size="13" font-weight="700">Google Gemini API</text>
      <text x="18" y="47" fill="#cbd5e1" font-size="11">gemini-2.5-flash / pro</text>
      <text x="18" y="62" fill="#64748b" font-size="10">Audio fallback + Primary summarizer</text>
    </g>

    <g transform="translate(495, 45)">
      <rect width="215" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="28" fill="#4ade80" font-size="13" font-weight="700">NVIDIA NIM / Groq LLM</text>
      <text x="18" y="47" fill="#cbd5e1" font-size="11">Nemotron / Qwen / Llama</text>
      <text x="18" y="62" fill="#64748b" font-size="10">Secondary &amp; fallback summarizers</text>
    </g>

    <g transform="translate(730, 45)">
      <rect width="205" height="75" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="18" y="28" fill="#c084fc" font-size="13" font-weight="700">GitHub &amp; Edge/Chrome</text>
      <text x="18" y="47" fill="#cbd5e1" font-size="11">Dynamic Config &amp; Updates</text>
      <text x="18" y="62" fill="#64748b" font-size="10">Headless PDF print engine</text>
    </g>
  </g>

  <!-- Vertical connector to cloud -->
  <line x1="635" y1="435" x2="635" y2="463" stroke="#34d399" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrow-green)"/>
</svg>
